[project]
name = "repomind"
version = "0.1.0"
description = "RepoMind — RAG-powered code assistant (terminal + web UI), running on Gemini"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "python-dotenv (>=1.2.2,<2.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "rich (>=13.9.0,<16.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "langchain (>=1.3.11,<2.0.0)",
    "langchain-google-genai (>=4.0.0,<5.0.0)",
    "langchain-openai (>=1.1.0,<2.0.0)",       # only for visitors who connect an OpenAI key
    "langchain-anthropic (>=1.1.0,<2.0.0)",    # only for visitors who connect an Anthropic key
    "langchain-qdrant (>=1.1.0,<2.0.0)",
    "fastembed (>=0.8.0,<0.9.0)",
    "rank-bm25 (>=0.2.2,<0.3.0)",
    "langgraph-checkpoint-sqlite (>=3.1.0,<4.0.0)",
    "tree-sitter (==0.21.3)",
    "tree-sitter-languages (==1.10.2)",
    "langchain-mcp-adapters (>=0.3.0,<0.4.0)",
    "watchdog (>=6.0.0,<7.0.0)",
    "redis (>=7.4.1,<9.0.0)",
    "redisvl (>=0.23.0,<0.30.0)",
    "fastapi (>=0.115.0,<1.0.0)",
    "uvicorn[standard] (>=0.30.0,<1.0.0)",
    "python-multipart (>=0.0.9,<1.0.0)",
]

[project.scripts]
repomind = "repomind.main:run"                 # terminal REPL in the current directory
repomind-web = "repomind.server.app:serve"     # web UI + API

[tool.setuptools.packages.find]
include = ["repomind*"]

[tool.setuptools.package-data]
repomind = ["config.yaml", "repomind_mcp_servers.json"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
